<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="30%" stop-color="#F5E8C8" />
      <stop offset="55%" stop-color="#C5A059" />
      <stop offset="85%" stop-color="#E8D09E" />
      <stop offset="100%" stop-color="#A6813B" />
    </linearGradient>

    <!-- Deep Eucalyptus Teal Radial Gradient -->
    <radialGradient id="tealBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D5A4E" />
      <stop offset="60%" stop-color="#244B40" />
      <stop offset="100%" stop-color="#142F28" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#tealBg)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Delicate Gold Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.85" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- 4 Cardinal Decorative Ornaments -->
  <g fill="url(#goldGrad)">
    <!-- Top -->
    <path d="M256,58 L262,72 L256,86 L250,72 Z" />
    <circle cx="256" cy="72" r="2.5" fill="#fff" />
    <!-- Bottom -->
    <path d="M256,426 L262,440 L256,454 L250,440 Z" />
    <circle cx="256" cy="440" r="2.5" fill="#fff" />
    <!-- Left -->
    <path d="M58,256 L72,262 L86,256 L72,250 Z" />
    <circle cx="72" cy="256" r="2.5" fill="#fff" />
    <!-- Right -->
    <path d="M426,256 L440,262 L454,256 L440,250 Z" />
    <circle cx="440" cy="256" r="2.5" fill="#fff" />
  </g>

  <!-- Auspicious Crown / Ganesha Emblem at Top -->
  <g fill="url(#goldGrad)" transform="translate(206, 105) scale(4.2)">
    <path d="M12,2A3,3 0 0,0 9,5C9,6.08 9.58,7.03 10.44,7.56C8.84,8.16 7.64,9.5 7.22,11.2C6.35,10.66 5.3,10.5 4.38,10.9C3.1,11.47 2.3,12.75 2.3,14.15C2.3,16.5 4.75,18 7,18C8.5,18 9.87,17.27 10.74,16.14C11.36,16.69 12.14,17 13,17C14.66,17 16,15.66 16,14C16,13.21 15.69,12.5 15.19,11.96C16.84,11.35 18,9.8 18,8C18,5.79 16.21,4 14,4C13.65,4 13.31,4.05 13,4.13C12.7,2.9 11.47,2 12,2M12,4A1,1 0 0,1 13,5A1,1 0 0,1 12,6A1,1 0 0,1 11,5A1,1 0 0,1 12,4M14,6A2,2 0 0,1 16,8A2,2 0 0,1 14,10A2,2 0 0,1 12,8A2,2 0 0,1 14,6M7,12.5C7.83,12.5 8.5,13.17 8.5,14C8.5,14.83 7.83,15.5 7,15.5C6.17,15.5 5.5,14.83 5.5,14C5.5,13.17 6.17,12.5 7,12.5Z"/>
  </g>

  <!-- Interlocking Monogram Typography: A & M -->
  <!-- "A" Letter -->
  <text x="175" y="325" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="138" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">A</text>
  
  <!-- Ampersand "&" in Script Flourish -->
  <text x="256" y="315" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="96" font-style="italic" fill="#ffffff" text-anchor="middle" opacity="0.95" filter="url(#goldGlow)">&amp;</text>
  
  <!-- "M" Letter -->
  <text x="338" y="325" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="138" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">M</text>

  <!-- Bottom Auspicious Subtitle Line / Ribbon Accent -->
  <g transform="translate(156, 365)">
    <line x1="10" y1="0" x2="70" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="100" cy="0" r="4" fill="url(#goldGrad)" />
    <polygon points="100,-6 106,0 100,6 94,0" fill="#ffffff" />
    <line x1="130" y1="0" x2="190" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <text x="256" y="405" font-family="'Cinzel', Montserrat, sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">WEDDING</text>
</svg>
